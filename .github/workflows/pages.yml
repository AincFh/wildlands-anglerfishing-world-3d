name: Test and deploy WILDLANDS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact runtime package for local browser shipping
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Vendor and verify self-hosted Three.js
        run: npm run vendor:three && npm run verify:three
      - name: Verify deployment ESM graph has a single immutable release version
        run: |
          mkdir -p dist
          cp -r next dist/next
          node scripts/version-next.mjs
          node --check dist/next/src/main.js
          node --check dist/next/src/angler.js
          node --check dist/next/src/world/fishModel.js
          rm -rf dist
      - name: JavaScript syntax
        run: node --check game.js && node --check fight.js && node --check next/src/main.js && node --check next/src/angler.js && node --check next/src/sim/bait.mjs && node --check next/src/sim/fishMotion.mjs
      - name: Deterministic fish combat tests
        run: node --test tests/fight.test.cjs tests/bait.test.mjs tests/fish-motion.test.mjs
      - name: Verify asset and site completeness
        run: python3 tests/verify_distribution.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: wildlands-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build local Three.js runtime for publishing
        run: |
          npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          npm run vendor:three
          npm run verify:three
      - uses: actions/configure-pages@v5
      - name: Build GitHub Pages artifact
        run: |
          mkdir -p dist
          cp index.html game.js fight.js style.css dist/
          cp -r assets dist/assets
          cp -r next dist/next
          node scripts/version-next.mjs
          grep -q "?v=" dist/next/index.html
          grep -q "?v=" dist/next/src/angler.js
          test -s dist/next/vendor/three/build/three.module.js
          test -s dist/next/vendor/three/build/three.core.js
          test -s dist/next/vendor/three/LICENSE
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

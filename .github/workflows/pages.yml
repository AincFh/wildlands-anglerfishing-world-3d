name: Test and deploy WILDLANDS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check game.js && node --check fight.js && node --check next/src/main.js && node --check next/src/angler.js
      - name: Deterministic fish combat tests
        run: node --test tests/fight.test.cjs
      - name: Verify asset and site completeness
        run: python3 tests/verify_distribution.py
  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: wildlands-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build GitHub Pages artifact
        run: |
          mkdir -p dist
          cp index.html game.js fight.js style.css dist/
          cp -r assets dist/assets
          cp -r next dist/next
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
